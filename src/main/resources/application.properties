spring.application.name=gestione-ticket

spring.datasource.url=jdbc:mysql://localhost:3306/gestioneticket
spring.datasource.username=root
spring.datasource.password=root

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate auto ddl
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=DEBUG



spring.web.error.include-binding-errors=always
spring.web.error.include-message=always
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=TRACE

# CONFIGURAZIONI

# GraphQL
server.port=8085

# Scheduler
scheduler.create=600000
scheduler.check=3600000

# Timeout
http.client.connect-timeout=10000
http.client.read-timeout=10000

# Retry
http.client.max-attempts=3
http.client.retry.backoff=10000

# URL
http.client.url=https://jsonplaceholder.typicode.com/users

# MONGODB CONFIG
spring.data.mongodb.uri=mongodb://localhost:27017/ticketdb
spring.data.mongodb.database=ticketdb
spring.data.mongodb.auto-index-creation=true

# RABBITMQ CONFIG
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

# MICROMETER TRACING CONFIG
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4321/v1/traces

# ACTUATOR
management.server.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.observations.http.client.enabled=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true