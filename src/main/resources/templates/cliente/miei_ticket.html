<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{fragments/fragments :: head('I Miei Ticket')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0">I Miei Ticket</h1>
            <p class="text-white-50">Le tue richieste di assistenza inviate al team di supporto.</p>
        </div>
        <a th:href="@{/cliente/ticket/crea}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i> Nuovo Ticket
        </a>
    </div>

    <div class="table-responsive shadow-lg rounded-4">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th class="ps-4" style="width: 5%">ID</th>
                    <th style="width: 22%">Dettagli</th>
                    <th style="width: 10%">Categoria</th>
                    <th class="text-center" style="width: 8%">Priorità</th>
                    <th style="width: 12%">Stato</th>
                    <th style="width: 13%">Apertura</th>
                    <th style="width: 13%">Chiusura</th>
                    <th class="text-end pe-4" style="width: 17%">Azioni</th>
                </tr>
            </thead>
            <tbody class="border-top-0">
                <tr th:if="${mieiTicket.totalElements == 0}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-3 opacity-25"></i>
                        Non hai ancora ticket.
                    </td>
                </tr>
                <tr th:each="t : ${mieiTicket.content}">
                    <td class="ps-4 fw-bold text-muted" th:text="${t.idTicket}">1</td>
                    <td>
                        <div class="fw-semibold text-dark mb-1" th:text="${t.titolo}">Titolo</div>
                        <div class="small text-muted text-truncate" style="max-width: 220px;" th:text="${t.descrizione}">Desc</div>
                    </td>
                    <td><span class="badge bg-light text-dark border fw-medium" th:text="${t.categoria}">Cat</span></td>
                    <td class="text-center">
                        <span class="fw-bold" th:classappend="${t.priorita >= 3 ? 'text-danger' : 'text-primary'}" th:text="${t.priorita}">1</span>
                    </td>
                    <td>
                        <span th:if="${t.stato == 'APERTO'}" class="badge-status status-aperto"><i class="bi bi-circle-fill" style="font-size: 0.5rem"></i> Aperto</span>
                        <span th:if="${t.stato == 'IN_LAVORAZIONE'}" class="badge-status status-lavorazione"><i class="bi bi-play-fill"></i> In lavorazione</span>
                        <span th:if="${t.stato == 'IN_ATTESA'}" class="badge-status status-attesa"><i class="bi bi-pause-fill"></i> In attesa</span>
                        <span th:if="${t.stato == 'RISOLTO'}" class="badge-status status-risolto"><i class="bi bi-check-all"></i> Risolto</span>
                        <span th:if="${t.stato == 'CHIUSO'}" class="badge-status status-chiuso"><i class="bi bi-check-lg"></i> Chiuso</span>
                        <span th:if="${t.stato == 'SCADUTO'}" class="badge-status status-scaduto"><i class="bi bi-exclamation-triangle-fill"></i> Scaduto</span>
                    </td>
                    <td class="small text-muted" th:text="${#temporals.format(t.data_ora_apertura, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="small text-muted" th:text="${t.data_ora_chiusura != null ? #temporals.format(t.data_ora_chiusura, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                    <td class="text-end pe-4">
                        <a class="btn btn-sm btn-primary" th:href="@{/cliente/commenti/crea (ticketId=${t.idTicket})}">
                            <i class="bi bi-file-plus me-1"></i> Commenta
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginazione -->
    <div class="d-flex justify-content-between align-items-center mt-4" th:if="${mieiTicket != null and mieiTicket.totalPages > 0}">
        <div class="text-white-50 small">
            Pagina <span th:text="${mieiTicket.number + 1}">1</span> di <span th:text="${mieiTicket.totalPages}">1</span>
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${mieiTicket.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/cliente/miei-ticket(pag=0)}"><i class="bi bi-chevron-double-left"></i></a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, mieiTicket.number - 2), T(java.lang.Math).min(mieiTicket.totalPages - 1, mieiTicket.number + 2))}" th:classappend="${i == mieiTicket.number} ? 'active'">
                    <a class="page-link" th:text="${i + 1}" th:href="@{/cliente/miei-ticket(pag=${i})}"></a>
                </li>
                <li class="page-item" th:classappend="${mieiTicket.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/cliente/miei-ticket(pag=${mieiTicket.totalPages - 1})}"><i class="bi bi-chevron-double-right"></i></a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
