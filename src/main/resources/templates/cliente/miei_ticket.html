<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <title>Miei Ticket</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: Arial; padding: 20px; background-color: #f5f7fa }
        table td, table th {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<h2 class="text-center mb-4">
    I miei ticket &nbsp;
    <a th:href="@{/home}" class="text-primary" style="text-decoration:none;">
        <i class="bi bi-house-door-fill"></i>
    </a>
</h2>

<div th:if="${mieiTicket.totalElements == 0}" class="alert alert-info">
    Non hai ancora ticket.
</div>

<table class="table table-bordered table-hover" style="table-layout: fixed; width: 100%;">
    <thead class="thead-light">
    <tr>
        <th style="width: 4%">ID</th>
        <th style="width: 12%">Titolo</th>
        <th style="width: 15%">Descrizione</th>
        <th style="width: 10%">Categoria</th>
        <th style="width: 6%">Priorità</th>
        <th style="width: 10%">Stato</th>
        <th style="width: 13%">Data apertura</th>
        <th style="width: 13%">Data chiusura</th>
        <th style="width: 17%">Azioni</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${mieiTicket.totalElements == 0}">
        <td colspan="9" class="text-center text-muted">Nessun risultato trovato</td>
    </tr>
    <tr th:each="t : ${mieiTicket.content}">
        <td th:text="${t.idTicket}"></td>
        <td th:text="${t.titolo}" th:title="${t.titolo}"></td>
        <td th:text="${t.descrizione}" th:title="${t.descrizione}"></td>
        <td th:text="${t.categoria}" th:title="${t.categoria}"></td>
        <td th:text="${t.priorita}"></td>
        <td th:text="${t.stato}" th:title="${t.stato}"></td>
        <td th:text="${#temporals.format(t.data_ora_apertura, 'dd/MM/yyyy HH:mm')}"
            th:title="${#temporals.format(t.data_ora_apertura, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${t.data_ora_chiusura != null ? #temporals.format(t.data_ora_chiusura, 'dd/MM/yyyy HH:mm') : '-'}"
            th:title="${t.data_ora_chiusura != null ? #temporals.format(t.data_ora_chiusura, 'dd/MM/yyyy HH:mm') : '-'}"></td>
        <td>
            <a class="btn btn-success btn-sm" title="Crea commento"
               th:href="@{/cliente/commenti/crea (ticketId=${t.idTicket})}" role="button">
                <i class="bi bi-file-plus"></i> Crea commento
            </a>
        </td>
    </tr>
    </tbody>
</table>

<div class="d-flex justify-content-center mt-4" th:if="${mieiTicket != null and mieiTicket.totalPages > 0}">
    <nav aria-label="Page navigation">
        <ul class="pagination">

            <li class="page-item" th:classappend="${mieiTicket.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${!mieiTicket.first} ? @{/cliente/ticket(pag=0)} : '#'">
                    &laquo;&laquo;
                </a>
            </li>

            <li class="page-item" th:classappend="${mieiTicket.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${!mieiTicket.first} ? @{/cliente/ticket(pag=${mieiTicket.number - 1})} : '#'">
                    &laquo;
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(
                    T(java.lang.Math).max(0, mieiTicket.number - 5),
                    T(java.lang.Math).min(mieiTicket.totalPages - 1, mieiTicket.number + 5))}"
                th:classappend="${i == mieiTicket.number} ? 'active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/cliente/ticket(pag=${i})}">
                </a>
            </li>

            <li class="page-item" th:classappend="${mieiTicket.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${!mieiTicket.last} ? @{/cliente/ticket(pag=${mieiTicket.number + 1})} : '#'">
                    &raquo;
                </a>
            </li>

            <li class="page-item" th:classappend="${mieiTicket.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${!mieiTicket.last} ? @{/cliente/ticket(pag=${mieiTicket.totalPages - 1})} : '#'">
                    &raquo;&raquo;
                </a>
            </li>

        </ul>
    </nav>
</div>

<div class="mt-3">
    <a class="btn btn-secondary" th:href="@{/home}" role="button">
        <i class="bi bi-arrow-left"></i> Torna alla Home
    </a>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
