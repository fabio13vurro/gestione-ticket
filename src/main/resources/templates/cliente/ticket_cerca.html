<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cerca Ticket</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{font-family: Arial; padding: 20px; background-color: #f5f7fa}
        h1{text-align: center}
    </style>
</head>
<body>
<h1>Cerca Ticket per ID</h1>
<hr>

<form th:action="@{/cliente/ticket/cerca}" method="post">
    <input type="number" name="id" placeholder="ID" required>
    <button type="submit">Cerca</button>
</form>

<div th:if="${ticket}" class="table-responsive">
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Titolo</th>
            <th scope="col">Descrizione</th>
            <th scope="col">Categoria</th>
            <th scope="col">Stato</th>
            <th scope="col">Data apertura</th>
            <th scope="col">Data chiusura</th>
            <th scope="col">Sla</th>
            <th scope="col">Priorità</th>
            <th scope="col">Utente</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <th scope="row" th:text="${ticket.idTicket}">1</th>
            <td th:text="${ticket.titolo}">Titolo</td>
            <td th:text="${ticket.descrizione}">Descrizione</td>
            <td th:text="${ticket.categoria}">Categoria</td>
            <td th:text="${ticket.stato}">APERTO</td>
            <td th:text="${ticket.data_ora_apertura}">2026-01-22T10:00</td>
            <td th:text="${ticket.data_ora_chiusura}">2026-01-22T10:00</td>
            <td th:text="${ticket.sla}">1</td>
            <td th:text="${ticket.priorita}">1</td>
            <td th:text="${ticket.utente.username}">admin</td>
        </tr>
        </tbody>
    </table>
</div>

<hr>
<p><a class="btn btn-secondary" th:href="@{/home}" role="button">← Torna alla Home</a></p>
</body>
</html>
