<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body{font-family: Arial; padding: 20px; background-color: #f5f7fa}
    </style>
</head>
<body>

<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card p-4 shadow" style="width: 350px; border-radius: 10px; background-color: #ffffff; border: 1px solid #dce3ed">

        <h2 class="text-center mb-4">
            Crea ticket &nbsp;
            <a th:href="@{/home}" class="text-primary" style="text-decoration:none;">
                <i class="bi bi-house-door-fill"></i>
            </a>
        </h2>

        <form th:action="@{/cliente/ticket/crea}" method="post">
            <div class="form-group">
                <label for="titolo">Titolo</label>
                <input type="text" class="form-control" id="titolo" name="titolo" required>
            </div>
            <div class="form-group">
                <label for="descr">Descrizione</label>
                <input type="text" class="form-control" id="descr" name="descrizione" required>
            </div>
            <div class="form-group mt-3">
                <label for="categoria">Categoria</label>
                <input type="text" class="form-control" id="categoria" name="categoria" required>
            </div>
            <div class="form-group mt-3">
                <label for="priorita">Priorità</label>
                <input type="number" class="form-control" id="priorita" name="priorita" min="1" max="5" required>
            </div>
            <div class="form-group mt-3">
                <label for="data">Data chiusura</label>
                <input type="datetime-local" class="form-control" id="data" name="data_ora_chiusura" required>
            </div>
            <div class="form-group mt-3">
                <label for="sla">Sla</label>
                <input type="number" class="form-control" id="sla" name="sla" min="1" max="5" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-3">Crea</button>
        </form>
    </div>
</div>
</body>
</html>
