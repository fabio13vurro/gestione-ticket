<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Nuovo Ticket — Supporto')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-9">
            <div class="card border-0 shadow-lg p-2 p-md-4">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-primary bg-gradient p-3 rounded-3 me-3">
                            <i class="bi bi-megaphone text-white fs-4"></i>
                        </div>
                        <div>
                            <h2 class="text-dark mb-0 border-0 p-0">Apri una Segnalazione</h2>
                            <p class="text-muted small mb-0">Descrivi il tuo problema e il nostro team ti risponderà il prima possibile.</p>
                        </div>
                    </div>

                    <form th:action="@{/cliente/ticket/crea}" method="post">
                        <div class="row g-4">
                            <div class="col-12">
                                <label for="titolo" class="form-label fw-semibold">Titolo Sintetico</label>
                                <input type="text" class="form-control" id="titolo" name="titolo" placeholder="es. Impossibile accedere alla mail aziendale" required>
                                <div class="form-text small">Usa un titolo breve che riassuma chiaramente il problema.</div>
                            </div>

                            <div class="col-12">
                                <label for="descr" class="form-label fw-semibold">Descrizione Dettagliata</label>
                                <textarea class="form-control" id="descr" name="descrizione" rows="4" placeholder="Fornisci quanti più dettagli possibili (es. messaggi di errore, passi eseguiti...)" required></textarea>
                            </div>

                            <div class="col-md-6">
                                <label for="categoria" class="form-label fw-semibold">Categoria Problema</label>
                                <select class="form-select" id="categoria" name="categoria" required>
                                    <option value="" disabled selected>Scegli una categoria...</option>
                                    <option value="Hardware">Hardware (PC, Stampanti, Monitor)</option>
                                    <option value="Software">Software (Applicativi, OS)</option>
                                    <option value="Network">Rete & Connettività (Wi-Fi, VPN)</option>
                                    <option value="Account">Account & Password</option>
                                    <option value="Altro">Altro</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="priorita" class="form-label fw-semibold">Urgenza Stimata</label>
                                <select class="form-select" id="priorita" name="priorita" required>
                                    <option value="1">Bassa (Attività non bloccata)</option>
                                    <option value="2" selected>Media (Attività rallentata)</option>
                                    <option value="3">Alta (Utenza bloccata)</option>
                                    <option value="4">Critica (Intero ufficio/reparto bloccato)</option>
                                </select>
                            </div>

                            <div class="col-12 mt-5">
                                <hr class="my-4 opacity-10">
                                <div class="d-flex gap-3 justify-content-end">
                                    <a th:href="@{/home}" class="btn btn-outline-secondary px-4">Annulla</a>
                                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow">
                                        Invia Segnalazione <i class="bi bi-send-fill ms-2"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
