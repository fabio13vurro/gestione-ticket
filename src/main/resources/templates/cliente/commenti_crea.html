<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/springsecurity">
<head th:replace="~{fragments/fragments :: head('Crea Commento')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card border-0 shadow-lg p-2 p-md-4">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-primary bg-gradient p-3 rounded-3 me-3">
                            <i class="bi bi-chat-left-text text-white fs-4"></i>
                        </div>
                        <div>
                            <h2 class="text-dark mb-0 border-0 p-0">Nuovo Commento</h2>
                            <p class="text-muted small mb-0">Aggiungi un commento al ticket selezionato.</p>
                        </div>
                    </div>

                    <form th:action="@{/cliente/commenti/crea}" method="post">
                        <input type="hidden" name="ticketId" th:value="${ticketSelezionato.idTicket}">
                        <div class="mb-3">
                            <label for="testo" class="form-label fw-semibold">Testo del commento</label>
                            <textarea class="form-control" id="testo" name="testo" rows="4" placeholder="Scrivi il tuo commento..." required></textarea>
                        </div>
                        <div class="mb-3" sec:authorize="hasAnyRole('OPERATORE','ADMIN')">
                            <label for="tipo" class="form-label fw-semibold">Tipo</label>
                            <select class="form-select" id="tipo" name="tipo">
                                <option value="ESTERNO">Esterno (visibile al cliente)</option>
                                <option value="INTERNO">Interno (solo operatori)</option>
                            </select>
                        </div>
                        <div class="d-flex gap-3 justify-content-end mt-4">
                            <a th:href="@{/home}" class="btn btn-outline-secondary px-4">Annulla</a>
                            <button type="submit" class="btn btn-primary px-5 fw-bold shadow">
                                Pubblica <i class="bi bi-send-fill ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
