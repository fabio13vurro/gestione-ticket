<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{fragments/fragments :: head('I Miei Commenti')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="mb-4">
        <h1 class="mb-0">I Miei Commenti</h1>
        <p class="text-white-50">Storico di tutti i commenti che hai scritto sui ticket.</p>
    </div>

    <div class="table-responsive shadow-lg rounded-4">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th class="ps-4" style="width: 5%">ID</th>
                    <th style="width: 15%">Data / Ora</th>
                    <th style="width: 10%">Tipo</th>
                    <th style="width: 30%">Testo</th>
                    <th class="text-center" style="width: 8%">ID Ticket</th>
                    <th style="width: 32%">Titolo Ticket</th>
                </tr>
            </thead>
            <tbody class="border-top-0">
                <tr th:if="${mieiCommenti.totalElements == 0}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="bi bi-chat-dots fs-1 d-block mb-3 opacity-25"></i>
                        Non hai ancora commenti.
                    </td>
                </tr>
                <tr th:each="c : ${mieiCommenti.content}">
                    <td class="ps-4 fw-bold text-muted" th:text="${c.idCommento}">1</td>
                    <td class="small text-muted" th:text="${#temporals.format(c.data_ora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                    <td>
                        <span th:if="${c.tipo == 'ESTERNO'}" class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-2 py-1">ESTERNO</span>
                        <span th:if="${c.tipo == 'INTERNO'}" class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1">INTERNO</span>
                    </td>
                    <td th:text="${c.testo}" th:title="${c.testo}">Testo</td>
                    <td class="text-center">
                        <span class="badge rounded-pill bg-secondary bg-opacity-10 text-secondary border px-2 py-1" th:text="${c.ticket != null ? c.ticket.idTicket : '—'}">12</span>
                    </td>
                    <td th:text="${(c.ticket != null &amp;&amp; c.ticket.titolo != null) ? c.ticket.titolo : '—'}" th:title="${(c.ticket != null &amp;&amp; c.ticket.titolo != null) ? c.ticket.titolo : '—'}">Titolo</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginazione -->
    <div class="d-flex justify-content-between align-items-center mt-4" th:if="${mieiCommenti != null and mieiCommenti.totalPages > 0}">
        <div class="text-white-50 small">
            Pagina <span th:text="${mieiCommenti.number + 1}">1</span> di <span th:text="${mieiCommenti.totalPages}">1</span>
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${mieiCommenti.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/cliente/commenti(pag=0)}"><i class="bi bi-chevron-double-left"></i></a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, mieiCommenti.number - 2), T(java.lang.Math).min(mieiCommenti.totalPages - 1, mieiCommenti.number + 2))}" th:classappend="${i == mieiCommenti.number} ? 'active'">
                    <a class="page-link" th:text="${i + 1}" th:href="@{/cliente/commenti(pag=${i})}"></a>
                </li>
                <li class="page-item" th:classappend="${mieiCommenti.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/cliente/commenti(pag=${mieiCommenti.totalPages - 1})}"><i class="bi bi-chevron-double-right"></i></a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
