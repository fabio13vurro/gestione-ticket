<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8"/>
    <title>I miei commenti</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: Arial; padding: 20px; background-color: #f5f7fa }
        table td, table th {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<h2 class="text-center mb-4">
    I miei commenti &nbsp;
    <a th:href="@{/home}" class="text-primary" style="text-decoration:none;">
        <i class="bi bi-house-door-fill"></i>
    </a>
</h2>

<div th:if="${mieiCommenti.totalElements == 0}" class="alert alert-info">
    Non hai ancora commenti.
</div>

<table class="table table-bordered table-hover" style="table-layout: fixed; width: 100%;">
    <thead class="thead-light">
    <tr>
        <th style="width: 5%">ID</th>
        <th style="width: 15%">Data/Ora</th>
        <th style="width: 10%">Tipo</th>
        <th style="width: 30%">Testo</th>
        <th style="width: 8%">ID Ticket</th>
        <th style="width: 32%">Titolo Ticket</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${mieiCommenti.totalElements == 0}">
        <td colspan="6" class="text-center text-muted">Nessun risultato trovato</td>
    </tr>
    <tr th:each="c : ${mieiCommenti.content}">
        <td th:text="${c.idCommento}" th:title="${c.idCommento}">1</td>
        <td th:text="${#temporals.format(c.data_ora, 'dd/MM/yyyy HH:mm')}"
            th:title="${#temporals.format(c.data_ora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
        <td th:text="${c.tipo}" th:title="${c.tipo}">ESTERNO</td>
        <td th:text="${c.testo}" th:title="${c.testo}">Testo</td>
        <td th:text="${c.ticket != null ? c.ticket.idTicket : '—'}">12</td>
        <td th:text="${(c.ticket != null && c.ticket.titolo != null) ? c.ticket.titolo : '—'}"
            th:title="${(c.ticket != null && c.ticket.titolo != null) ? c.ticket.titolo : '—'}">Titolo</td>
    </tr>
    </tbody>
</table>

<div class="d-flex justify-content-center mt-4" th:if="${mieiCommenti != null and mieiCommenti.totalPages > 0}">
    <nav aria-label="Page navigation">
        <ul class="pagination">

            <li class="page-item" th:classappend="${mieiCommenti.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${!mieiCommenti.first} ? @{/cliente/commenti(pag=0)} : '#'">
                    &laquo;&laquo;
                </a>
            </li>

            <li class="page-item" th:classappend="${mieiCommenti.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${!mieiCommenti.first} ? @{/cliente/commenti(pag=${mieiCommenti.number - 1})} : '#'">
                    &laquo;
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(
                    T(java.lang.Math).max(0, mieiCommenti.number - 5),
                    T(java.lang.Math).min(mieiCommenti.totalPages - 1, mieiCommenti.number + 5))}"
                th:classappend="${i == mieiCommenti.number} ? 'active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/cliente/commenti(pag=${i})}">
                </a>
            </li>

            <li class="page-item" th:classappend="${mieiCommenti.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${!mieiCommenti.last} ? @{/cliente/commenti(pag=${mieiCommenti.number + 1})} : '#'">
                    &raquo;
                </a>
            </li>

            <li class="page-item" th:classappend="${mieiCommenti.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${!mieiCommenti.last} ? @{/cliente/commenti(pag=${mieiCommenti.totalPages - 1})} : '#'">
                    &raquo;&raquo;
                </a>
            </li>

        </ul>
    </nav>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
