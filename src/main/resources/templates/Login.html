<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Login — TicketManager')}"></head>
<body>

<div class="d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card p-4 shadow-lg border-0" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <div class="bg-primary bg-gradient d-inline-block p-2 rounded-circle mb-2 shadow">
                <i class="bi bi-ticket-perforated text-white fs-3"></i>
            </div>
            <h2 class="text-dark mb-1">Benvenuto</h2>
            <p class="text-muted">Accedi al tuo account per gestire i ticket</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label text-dark fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Inserisci username" required autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label text-dark fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5 shadow-sm mt-3">
                Accedi<i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="mt-4 text-center">
            <p class="small text-muted mb-1">Sistema di Supporto Aziendale</p>
            <hr class="opacity-25 my-1">
            <p class="small text-muted mb-0">© 2026 TicketManager</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
