<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifica ticket</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: Arial; padding: 20px; background-color: #f5f7fa}
        button{text-align: center}
    </style>
</head>
<body>
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 shadow" style="width: 350px; border-radius: 10px; background-color: #ffffff; border: 1px solid #dce3ed">
        <h2 class="text-center mb-4">
            Modifica ticket &nbsp;
            <a th:href="@{/operatore/ticket}" class="text-primary" style="text-decoration:none;">
                <i class="bi bi-arrow-left"></i>
            </a>
        </h2>

        <form th:action="@{/operatore/ticket/modifica}" method="post">
            <div class="form-group">
                <label class="field">
                    Id ticket:
                    <input type="number" name="id" th:value="${ticket.getIdTicket()}" readonly/>
                </label>
            </div>
            <div class="form-group">
                <label for="titolo">Titolo</label>
                <input type="text" class="form-control" id="titolo" name="titolo">
            </div>
            <div class="form-group">
                <label for="descrizione">Descrizione</label>
                <input type="text" class="form-control" id="descrizione" name="descrizione">
            </div>
            <div class="form-group mt-3">
                <label for="categoria">Categoria</label>
                <input type="text" class="form-control" id="categoria" name="categoria">
            </div>
            <div class="form-check mt-3">
                <label for="priorita">Priorità</label>
                <input type="number" class="form-control" id="priorita" name="priorita" min="1" max="4">
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-3">Modifica</button>
        </form>
    </div>
</div>
</body>
</html>
