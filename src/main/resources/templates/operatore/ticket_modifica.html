<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Modifica Ticket — Operatore')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-lg p-2 p-md-4">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-primary bg-gradient p-3 rounded-3 me-3">
                            <i class="bi bi-pencil-square text-white fs-4"></i>
                        </div>
                        <div>
                            <h2 class="text-dark mb-0 border-0 p-0">Modifica Ticket</h2>
                            <p class="text-muted small mb-0">Aggiorna i dati del ticket selezionato.</p>
                        </div>
                    </div>

                    <form th:action="@{/operatore/ticket/modifica}" method="post">
                        <input type="hidden" name="id" th:value="${ticket.getIdTicket()}" readonly/>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="titolo" class="form-label fw-semibold">Titolo</label>
                                <input type="text" class="form-control" id="titolo" name="titolo">
                            </div>
                            <div class="col-12">
                                <label for="descrizione" class="form-label fw-semibold">Descrizione</label>
                                <input type="text" class="form-control" id="descrizione" name="descrizione">
                            </div>
                            <div class="col-md-6">
                                <label for="categoria" class="form-label fw-semibold">Categoria</label>
                                <input type="text" class="form-control" id="categoria" name="categoria">
                            </div>
                            <div class="col-md-6">
                                <label for="priorita" class="form-label fw-semibold">Priorità</label>
                                <input type="number" class="form-control" id="priorita" name="priorita" min="1" max="4">
                            </div>
                            <div class="col-12 mt-4">
                                <div class="d-flex gap-3 justify-content-end">
                                    <a th:href="@{/operatore/ticket}" class="btn btn-outline-secondary px-4">Annulla</a>
                                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow">Salva Modifiche</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
