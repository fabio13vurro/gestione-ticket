<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifica Commento</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: Arial; padding: 20px; background-color: #f5f7fa}
        button{text-align: center}
    </style>
</head>
<body>
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 shadow" style="width: 350px; border-radius: 10px; background-color: #ffffff; border: 1px solid #dce3ed">
        <h2 class="text-center mb-4">
            Modifica Commento &nbsp;
            <a th:href="@{/operatore/commenti}" class="text-primary" style="text-decoration:none;">
                <i class="bi bi-arrow-left"></i>
            </a>
        </h2>

        <form th:action="@{/operatore/commenti/modifica}" method="post">
            <div class="form group">
                <label class="field">
                    ID Commento:
                    <input type="number" name="id" th:value="${commento.getIdCommento()}" readonly/>
                </label>
            </div>
            <div class="form-group">
                <label for="testo">Testo</label>
                <input type="text" class="form-control" id="testo" name="testo">
            </div>
            <div class="form-group mt-3">
                <label for="tipo">Tipo</label>
                <select class="form-control" id="tipo" name="tipo">
                    <option value="">-- Tipo --</option>
                    <option>INTERNO</option><option>ESTERNO</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-3">Modifica</button>
        </form>
    </div>
</div>
</body>
</html>
