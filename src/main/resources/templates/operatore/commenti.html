<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Gestione Commenti — Operatore')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0">Gestione Commenti</h1>
            <p class="text-white-50">Visualizza, modifica e gestisci tutti i commenti del sistema.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#filtri">
                <i class="bi bi-funnel me-1"></i> Filtri Avanzati
                <span th:if="${filtroAttivo}" class="badge bg-primary ms-1">Attivi</span>
            </button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#legenda">
                <i class="bi bi-info-circle me-1"></i> Legenda
            </button>
        </div>
    </div>

    <!-- Filtri e Legenda -->
    <div class="card mb-4 border-0 shadow-sm overflow-hidden">
        <div class="collapse" id="filtri" th:classappend="${filtroAttivo} ? 'show'">
            <div class="card-body bg-light border-bottom">
                <form th:action="@{/operatore/commenti}" method="get">
                    <div class="row g-3">
                        <div class="col-md-2">
                            <label class="form-label small fw-bold">Testo</label>
                            <input type="text" class="form-control form-control-sm" name="testo" th:value="${testo}" placeholder="Cerca per testo...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold">Tipo</label>
                            <select class="form-select form-select-sm" name="tipo">
                                <option value="">Tutti</option>
                                <option value="ESTERNO" th:selected="${tipo == 'ESTERNO'}">Esterno</option>
                                <option value="INTERNO" th:selected="${tipo == 'INTERNO'}">Interno</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold">ID Ticket</label>
                            <input type="number" class="form-control form-control-sm" name="codTicket" th:value="${codTicket}" placeholder="Ticket...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold">Utente</label>
                            <input type="text" class="form-control form-control-sm" name="created" th:value="${created}" placeholder="Username...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold">Data dal</label>
                            <input type="date" class="form-control form-control-sm" name="dataOraDa" th:value="${dataOraDa}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold">Data al</label>
                            <input type="date" class="form-control form-control-sm" name="dataOraA" th:value="${dataOraA}">
                        </div>
                        <div class="col-md-2 d-flex align-items-end gap-2">
                            <button class="btn btn-primary btn-sm flex-grow-1" type="submit">Filtra</button>
                            <a th:href="@{/operatore/commenti}" class="btn btn-outline-secondary btn-sm" th:if="${filtroAttivo}">Reset</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="collapse" id="legenda">
            <div class="card-body bg-light border-bottom py-2">
                <div class="d-flex flex-wrap gap-3 small text-muted">
                    <span><i class="bi bi-pencil-square text-primary me-1"></i>Modifica commento</span>
                    <span><i class="bi bi-trash text-danger me-1"></i>Elimina commento</span>
                    <span><i class="bi bi-arrow-repeat text-success me-1"></i>Ripristina commento</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabella Commenti -->
    <div class="table-responsive shadow-lg rounded-4">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th class="ps-4" style="width: 5%">ID</th>
                    <th style="width: 30%">Testo</th>
                    <th style="width: 10%">Tipo</th>
                    <th style="width: 15%">Utente</th>
                    <th style="width: 15%">Data</th>
                    <th class="text-center" style="width: 10%">Ticket</th>
                    <th class="text-end pe-4" style="width: 15%">Azioni</th>
                </tr>
            </thead>
            <tbody class="border-top-0">
                <tr th:if="${commenti.totalElements == 0}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-chat-dots fs-1 d-block mb-3 opacity-25"></i>
                        Nessun commento trovato.
                    </td>
                </tr>
                <tr th:each="c : ${commenti.content}" th:classappend="${c.deleted} ? 'opacity-50'">
                    <td class="ps-4 fw-bold text-muted" th:text="${c.idCommento}">1</td>
                    <td th:text="${c.testo}" th:title="${c.testo}">testo</td>
                    <td>
                        <span th:if="${c.tipo.name == 'ESTERNO'}" class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-2 py-1">ESTERNO</span>
                        <span th:if="${c.tipo.name == 'INTERNO'}" class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1">INTERNO</span>
                    </td>
                    <td th:text="${c.created}">utente</td>
                    <td class="small text-muted" th:text="${#temporals.format(c.data_ora, 'dd/MM/yyyy HH:mm')}">data</td>
                    <td class="text-center">
                        <span class="badge rounded-pill bg-secondary bg-opacity-10 text-secondary border px-2 py-1" th:text="'#' + ${c.ticket.idTicket}">1</span>
                    </td>
                    <td class="text-end pe-4">
                        <div class="btn-group btn-group-sm shadow-sm">
                            <a th:href="@{/operatore/commenti/modifica (id=${c.idCommento})}" class="btn btn-white border" title="Modifica">
                                <i class="bi bi-pencil-square text-primary"></i>
                            </a>
                            <a th:if="${!c.deleted}" th:href="@{/operatore/commenti/cancella (id=${c.idCommento})}" class="btn btn-white border" title="Elimina">
                                <i class="bi bi-trash text-danger"></i>
                            </a>
                            <a th:if="${c.deleted}" th:href="@{/operatore/commenti/ripristina (id=${c.idCommento})}" class="btn btn-white border" title="Ripristina">
                                <i class="bi bi-arrow-repeat text-success"></i>
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginazione -->
    <div class="d-flex justify-content-between align-items-center mt-4" th:if="${commenti != null and commenti.totalPages > 0}">
        <div class="text-white-50 small">
            Mostrando pagina <span th:text="${commenti.number + 1}">1</span> di <span th:text="${commenti.totalPages}">1</span>
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${commenti.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/operatore/commenti(pag=0, testo=${testo}, tipo=${tipo}, codTicket=${codTicket}, created=${created}, dataOraDa=${dataOraDa}, dataOraA=${dataOraA})}">
                        <i class="bi bi-chevron-double-left"></i>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, commenti.number - 2), T(java.lang.Math).min(commenti.totalPages - 1, commenti.number + 2))}" th:classappend="${i == commenti.number} ? 'active'">
                    <a class="page-link" th:text="${i + 1}" th:href="@{/operatore/commenti(pag=${i}, testo=${testo}, tipo=${tipo}, codTicket=${codTicket}, created=${created}, dataOraDa=${dataOraDa}, dataOraA=${dataOraA})}"></a>
                </li>
                <li class="page-item" th:classappend="${commenti.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/operatore/commenti(pag=${commenti.totalPages - 1}, testo=${testo}, tipo=${tipo}, codTicket=${codTicket}, created=${created}, dataOraDa=${dataOraDa}, dataOraA=${dataOraA})}">
                        <i class="bi bi-chevron-double-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
