<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{fragments/fragments :: head('Commenti Ticket — Operatore')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0">Commenti del Ticket #<span th:text="${ticketId}">0</span></h1>
            <p class="text-white-50">Tutti i commenti relativi a questo ticket.</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/operatore/ticket}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Torna alla Lista
            </a>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#legenda">
                <i class="bi bi-info-circle me-1"></i> Legenda
            </button>
        </div>
    </div>

    <div class="card mb-4 border-0 shadow-sm overflow-hidden">
        <div class="collapse" id="legenda">
            <div class="card-body bg-light border-bottom py-2">
                <div class="d-flex flex-wrap gap-3 small text-muted">
                    <span><i class="bi bi-pencil-square text-primary me-1"></i>Modifica</span>
                    <span><i class="bi bi-trash text-danger me-1"></i>Elimina</span>
                    <span><i class="bi bi-arrow-repeat text-success me-1"></i>Ripristina</span>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive shadow-lg rounded-4">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th class="ps-4" style="width: 5%">ID</th>
                    <th style="width: 15%">Data</th>
                    <th style="width: 10%">Tipo</th>
                    <th style="width: 15%">Utente</th>
                    <th style="width: 40%">Testo</th>
                    <th class="text-end pe-4" style="width: 15%">Azioni</th>
                </tr>
            </thead>
            <tbody class="border-top-0">
                <tr th:if="${commenti.totalElements == 0}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="bi bi-chat-dots fs-1 d-block mb-3 opacity-25"></i>
                        Nessun commento presente per questo ticket.
                    </td>
                </tr>
                <tr th:each="c : ${commenti.content}" th:classappend="${c.deleted} ? 'opacity-50'">
                    <td class="ps-4 fw-bold text-muted" th:text="${c.idCommento}">1</td>
                    <td class="small text-muted" th:text="${#temporals.format(c.data_ora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                    <td>
                        <span th:if="${c.tipo == 'ESTERNO'}" class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-2 py-1">ESTERNO</span>
                        <span th:if="${c.tipo == 'INTERNO'}" class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1">INTERNO</span>
                    </td>
                    <td th:text="${c.created}">utente</td>
                    <td th:text="${c.testo}" th:title="${c.testo}">Testo</td>
                    <td class="text-end pe-4">
                        <div class="btn-group btn-group-sm shadow-sm">
                            <a th:href="@{/operatore/commenti/modifica (id=${c.idCommento})}" class="btn btn-white border" title="Modifica"><i class="bi bi-pencil-square text-primary"></i></a>
                            <a th:if="${!c.deleted}" th:href="@{/operatore/commenti/cancella (id=${c.idCommento})}" class="btn btn-white border" title="Elimina"><i class="bi bi-trash text-danger"></i></a>
                            <a th:if="${c.deleted}" th:href="@{/operatore/commenti/ripristina (id=${c.idCommento})}" class="btn btn-white border" title="Ripristina"><i class="bi bi-arrow-repeat text-success"></i></a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginazione -->
    <div class="d-flex justify-content-between align-items-center mt-4" th:if="${commenti != null and commenti.totalPages > 0}">
        <div class="text-white-50 small">
            Pagina <span th:text="${commenti.number + 1}">1</span> di <span th:text="${commenti.totalPages}">1</span>
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${commenti.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/operatore/ticket/commenti(id=${ticketId}, pag=0)}"><i class="bi bi-chevron-double-left"></i></a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, commenti.number - 2), T(java.lang.Math).min(commenti.totalPages - 1, commenti.number + 2))}" th:classappend="${i == commenti.number} ? 'active'">
                    <a class="page-link" th:text="${i + 1}" th:href="@{/operatore/ticket/commenti(id=${ticketId}, pag=${i})}"></a>
                </li>
                <li class="page-item" th:classappend="${commenti.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/operatore/ticket/commenti(id=${ticketId}, pag=${commenti.totalPages - 1})}"><i class="bi bi-chevron-double-right"></i></a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
