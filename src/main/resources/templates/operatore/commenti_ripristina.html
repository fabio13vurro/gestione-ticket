<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Ripristina Commento — Operatore')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card border-0 shadow-lg p-4" style="max-width: 420px; width: 100%;">
        <div class="card-body text-center">
            <div class="bg-success bg-opacity-10 d-inline-flex p-3 rounded-circle mb-3">
                <i class="bi bi-arrow-repeat text-success fs-2"></i>
            </div>
            <h2 class="text-dark mb-2">Conferma Ripristino</h2>
            <p class="text-muted small">Stai per ripristinare questo commento.</p>

            <form th:action="@{/operatore/commenti/ripristina}" method="post" class="mt-4">
                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold text-muted">ID Commento</label>
                    <input type="number" class="form-control" th:value="${commento.getIdCommento()}" name="id" readonly>
                </div>
                <div class="d-flex gap-3">
                    <a class="btn btn-outline-secondary flex-grow-1" th:href="@{/operatore/commenti}">← Annulla</a>
                    <button class="btn btn-success flex-grow-1 fw-bold" type="submit">Ripristina</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
