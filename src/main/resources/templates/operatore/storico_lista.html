<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Storico Stati</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{font-family: Arial; padding: 20px; background-color: #f5f7fa}
        h1{text-align: center}
    </style>
</head>
<body>
<h2 class="text-center">Storico Ticket #<span th:text="${ticketId}"></span></h2>
<hr>

<div th:if="${#lists.isEmpty(storico)}" class="alert alert-info">
    Nessun storico presente per questo ticket.
</div>

<div th:if="${!#lists.isEmpty(storico)}" class="table-responsive">
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Stato Precedente</th>
            <th scope="col">Stato Nuovo</th>
            <th scope="col">Data</th>
            <th scope="col">Azioni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${storico}">
            <th scope="row" th:text="${s.idStoricoStato}">1</th>
            <td th:text="${s.stato_precedente}">APERTO</td>
            <td th:text="${s.stato_nuovo}">IN_LAVORAZIONE</td>
            <td th:text="${#temporals.format(s.data_ora, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <a class="btn btn-danger" th:href="@{/operatore/storico/cancella (id=${s.idStoricoStato})}" th:if="${!s.deleted}" role="button">Cancella</a>
                <a class="btn btn-success" th:href="@{/operatore/storico/ripristina (id=${s.idStoricoStato})}" th:if="${s.deleted}" role="button">Ripristina</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<p class="text-center">
    <a class="btn btn-secondary" th:href="@{/operatore/ticket}" role="button">← Torna ai Ticket</a>
    <a class="btn btn-primary" th:href="@{/home}" role="button">Vai alla Home</a>
</p>
</body>
</html>
