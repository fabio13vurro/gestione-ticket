<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Storico Stati — Operatore')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0">Storico Ticket #<span th:text="${ticketId}">0</span></h1>
            <p class="text-white-50">Cronologia dei cambi di stato per questo ticket.</p>
        </div>
        <a th:href="@{/operatore/ticket}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Torna ai Ticket
        </a>
    </div>

    <div class="table-responsive shadow-lg rounded-4">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th class="ps-4" style="width: 10%">ID</th>
                    <th style="width: 25%">Stato Precedente</th>
                    <th style="width: 25%">Stato Nuovo</th>
                    <th style="width: 25%">Data Cambio</th>
                    <th class="text-end pe-4" style="width: 15%">Azioni</th>
                </tr>
            </thead>
            <tbody class="border-top-0">
                <tr th:if="${#lists.isEmpty(storico)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-clock-history fs-1 d-block mb-3 opacity-25"></i>
                        Nessun storico presente per questo ticket.
                    </td>
                </tr>
                <tr th:each="s : ${storico}" th:classappend="${s.deleted} ? 'opacity-50'">
                    <td class="ps-4 fw-bold text-muted" th:text="${s.idStoricoStato}">1</td>
                    <td th:text="${s.stato_precedente}">APERTO</td>
                    <td th:text="${s.stato_nuovo}">IN_LAVORAZIONE</td>
                    <td class="small text-muted" th:text="${#temporals.format(s.data_ora, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-end pe-4">
                        <div class="btn-group btn-group-sm shadow-sm">
                            <a th:if="${!s.deleted}" th:href="@{/operatore/storico/cancella (id=${s.idStoricoStato})}" class="btn btn-white border" title="Cancella"><i class="bi bi-trash text-danger"></i></a>
                            <a th:if="${s.deleted}" th:href="@{/operatore/storico/ripristina (id=${s.idStoricoStato})}" class="btn btn-white border" title="Ripristina"><i class="bi bi-arrow-repeat text-success"></i></a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
