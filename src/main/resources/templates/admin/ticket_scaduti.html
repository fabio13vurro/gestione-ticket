<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista Ticket Scaduti</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: Arial; padding: 20px; background-color: #f5f7fa}
        h2 { text-align: center; }
        table td, table th {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h2 class="text-center mb-4">
    Ticket scaduti &nbsp;
    <a th:href="@{/home}" class="text-primary" style="text-decoration:none;">
        <i class="bi bi-house-door-fill"></i>
    </a>
</h2>

<div class="mb-3">
    <button class="btn btn-primary" type="button" data-toggle="collapse" data-target="#legenda">
        Apri/Chiudi legenda
    </button>
</div>

<div class="collapse mb-4" id="legenda">
    <div class="card card-body d-flex flex-row align-items-center"
         style="background-color: #ffffff; gap: 16px; flex-wrap: wrap; padding: 10px 16px;">
        <div class="d-flex align-items-center" style="gap: 6px;"><span class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></span> Cancella ticket</div>
        <div class="d-flex align-items-center" style="gap: 6px;"><span class="btn btn-success btn-sm"><i class="bi bi-arrow-repeat"></i></span> Ripristina ticket</div>
        <div class="d-flex align-items-center" style="gap: 6px;"><span class="btn btn-success btn-sm"><i class="bi bi-file-plus"></i></span> Crea Commento</div>
        <div class="d-flex align-items-center" style="gap: 6px;"><span class="btn btn-info btn-sm"><i class="bi bi-chat-square-text"></i></span> Vedi Commenti</div>
        <div class="d-flex align-items-center" style="gap: 6px;"><span class="btn btn-warning btn-sm"><i class="bi bi-ticket-perforated"></i></span> Cambia Stato</div>
        <div class="d-flex align-items-center" style="gap: 6px;"><span class="btn btn-secondary btn-sm"><i class="bi bi-archive"></i></span> Storico Stato</div>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-bordered table-hover" style="table-layout: fixed; width: 100%;">
        <thead>
        <tr>
            <th style="width: 5%">ID</th>
            <th style="width: 10%">Titolo</th>
            <th style="width: 10%">Descrizione</th>
            <th style="width: 10%">Categoria</th>
            <th style="width: 10%">Creato da</th> <th style="width: 12%">Data Apertura</th>
            <th style="width: 12%">Data Scadenza</th>
            <th style="width: 11%">Assegnato a</th>
            <th style="width: 20%">Azioni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${scaduti.totalElements == 0}">
            <td colspan="9" class="text-center text-muted">Non ci sono ticket scaduti.</td>
        </tr>
        <tr th:each="t : ${scaduti.content}">
            <th scope="row" th:text="${t.idTicket}" th:title="${t.idTicket}">1</th>
            <td th:text="${t.titolo}" th:title="${t.titolo}"></td>
            <td th:text="${t.descrizione}" th:title="${t.descrizione}"></td>
            <td th:text="${t.categoria}" th:title="${t.categoria}"></td>
            <td th:text="${t.created}" th:title="${t.created}"></td>
            <td th:text="${#temporals.format(t.data_ora_apertura, 'dd/MM/yyyy HH:mm')}"
                th:title="${#temporals.format(t.data_ora_apertura, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${#temporals.format(t.data_ora_scadenza, 'dd/MM/yyyy HH:mm')}"
                th:title="${#temporals.format(t.data_ora_scadenza, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${t.utente != null ? t.utente.username : 'N/D'}"
                th:title="${t.utente != null ? t.utente.username : ''}"></td>
            <td class="d-flex" style="gap: 2px;">
                <a class="btn btn-danger btn-sm" title="Cancella ticket" th:href="@{/operatore/ticket/cancella (id=${t.idTicket})}" th:if="${!t.deleted}"><i class="bi bi-trash"></i></a>
                <a class="btn btn-success btn-sm" title="Ripristina ticket" th:href="@{/operatore/ticket/ripristina (id=${t.idTicket})}" th:if="${t.deleted}"><i class="bi bi-arrow-repeat"></i></a>
                <a class="btn btn-success btn-sm" title="Crea commento" th:href="@{/cliente/commenti/crea (ticketId=${t.idTicket})}"><i class="bi bi-file-plus"></i></a>
                <a class="btn btn-info btn-sm" title="Vedi commenti" th:href="@{/operatore/ticket/commenti (id=${t.idTicket})}"><i class="bi bi-chat-square-text"></i></a>
                <a class="btn btn-warning btn-sm" title="Cambia stato" th:href="@{/operatore/ticket/stato (id=${t.idTicket})}"><i class="bi bi-ticket-perforated"></i></a>
                <a class="btn btn-secondary btn-sm" title="Storico stato" th:href="@{/operatore/ticket/storico (id=${t.idTicket})}"><i class="bi bi-archive"></i></a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="d-flex justify-content-center mt-4" th:if="${scaduti != null and scaduti.totalPages > 0}">
    <nav aria-label="Page navigation">
        <ul class="pagination">
            <li class="page-item" th:classappend="${scaduti.first} ? 'disabled'">
                <a class="page-link" th:href="${!scaduti.first} ? @{/admin/ticket-scaduti(pag=0)} : '#'"> &laquo;&laquo; </a>
            </li>
            <li class="page-item" th:classappend="${scaduti.first} ? 'disabled'">
                <a class="page-link" th:href="${!scaduti.first} ? @{/admin/ticket-scaduti(pag=${scaduti.number - 1})} : '#'"> &laquo; </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, scaduti.number - 3), T(java.lang.Math).min(scaduti.totalPages - 1, scaduti.number + 3))}"
                th:classappend="${i == scaduti.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}" th:href="@{/admin/ticket-scaduti(pag=${i})}"></a>
            </li>
            <li class="page-item" th:classappend="${scaduti.last} ? 'disabled'">
                <a class="page-link" th:href="${!scaduti.last} ? @{/admin/ticket-scaduti(pag=${scaduti.number + 1})} : '#'"> &raquo; </a>
            </li>
            <li class="page-item" th:classappend="${scaduti.last} ? 'disabled'">
                <a class="page-link" th:href="${!scaduti.last} ? @{/admin/ticket-scaduti(pag=${scaduti.totalPages - 1})} : '#'"> &raquo;&raquo; </a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
