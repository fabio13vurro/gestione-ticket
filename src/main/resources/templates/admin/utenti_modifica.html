<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Modifica Utente — Admin')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-lg p-2 p-md-4">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-primary bg-gradient p-3 rounded-3 me-3">
                            <i class="bi bi-pencil-square text-white fs-4"></i>
                        </div>
                        <div>
                            <h2 class="text-dark mb-0 border-0 p-0">Modifica Utente</h2>
                            <p class="text-muted small mb-0">Aggiorna i dati del profilo selezionato.</p>
                        </div>
                    </div>

                    <form th:action="@{/admin/utenti/modifica}" method="post">
                        <input type="hidden" name="id" th:value="${utente.getIdUtente()}" readonly/>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control" id="username" name="username">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Nuova Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Lascia vuoto per non modificare">
                            </div>
                            <div class="col-md-3">
                                <label for="via" class="form-label fw-semibold">Via</label>
                                <input type="text" class="form-control" id="via" name="via">
                            </div>
                            <div class="col-md-3">
                                <label for="citta" class="form-label fw-semibold">Città</label>
                                <input type="text" class="form-control" id="citta" name="citta">
                            </div>
                            <div class="col-12 mt-4">
                                <div class="d-flex gap-3 justify-content-end">
                                    <a th:href="@{/admin/utenti}" class="btn btn-outline-secondary px-4">Annulla</a>
                                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow">Salva Modifiche</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
