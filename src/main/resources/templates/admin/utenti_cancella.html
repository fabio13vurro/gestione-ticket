<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Cancella Utente — Admin')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card border-0 shadow-lg p-4" style="max-width: 420px; width: 100%;">
        <div class="card-body text-center">
            <div class="bg-danger bg-opacity-10 d-inline-flex p-3 rounded-circle mb-3">
                <i class="bi bi-exclamation-triangle text-danger fs-2"></i>
            </div>
            <h2 class="text-dark mb-2">Conferma Disattivazione</h2>
            <p class="text-muted small">Stai per disattivare l'utente. Questa azione è reversibile.</p>

            <form th:action="@{/admin/utenti/cancella}" method="post" class="mt-4">
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-muted">ID Utente</label>
                    <input type="number" class="form-control" name="id" th:value="${utente.idUtente}" readonly/>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold text-muted">Username</label>
                    <input type="text" class="form-control" name="username" th:value="${utente.username}" readonly/>
                </div>
                <div class="d-flex gap-3">
                    <a class="btn btn-outline-secondary flex-grow-1" th:href="@{/admin/utenti}">← Annulla</a>
                    <button class="btn btn-danger flex-grow-1 fw-bold" type="submit">Disattiva</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
