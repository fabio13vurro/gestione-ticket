<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Crea Utente — Admin')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-lg p-2 p-md-4">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-primary bg-gradient p-3 rounded-3 me-3">
                            <i class="bi bi-person-plus text-white fs-4"></i>
                        </div>
                        <div>
                            <h2 class="text-dark mb-0 border-0 p-0">Registrazione Utente</h2>
                            <p class="text-muted small mb-0">Inserisci i dati per creare un nuovo profilo nel sistema.</p>
                        </div>
                    </div>

                    <form th:action="@{/admin/utenti/crea}" method="post">
                        <div class="row g-3">
                            <!-- Sezione Credenziali -->
                            <div class="col-12">
                                <h6 class="text-primary text-uppercase small fw-bold mb-3">Credenziali di Accesso</h6>
                            </div>
                            <div class="col-md-6">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="es. mrossi" required>
                            </div>
                            <div class="col-md-6">
                                <label for="ruolo" class="form-label fw-semibold">Ruolo Sistema</label>
                                <select class="form-select" id="ruolo" name="ruolo" required>
                                    <option value="" disabled selected>Scegli...</option>
                                    <option value="CLIENTE">Cliente (Default)</option>
                                    <option value="OPERATORE">Operatore (Supporto)</option>
                                    <option value="ADMIN">Amministratore</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email Aziendale</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="mario.rossi@azienda.it" required>
                            </div>
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>

                            <!-- Sezione Recapiti -->
                            <div class="col-12 mt-4">
                                <h6 class="text-primary text-uppercase small fw-bold mb-3">Informazioni di Contatto</h6>
                            </div>
                            <div class="col-md-8">
                                <label for="via" class="form-label fw-semibold">Indirizzo / Via</label>
                                <input type="text" class="form-control" id="via" name="via" placeholder="es. Via Roma, 12" required>
                            </div>
                            <div class="col-md-4">
                                <label for="citta" class="form-label fw-semibold">Città</label>
                                <input type="text" class="form-control" id="citta" name="citta" placeholder="es. Milano" required>
                            </div>

                            <div class="col-12 mt-5">
                                <hr class="my-4 opacity-10">
                                <div class="d-flex gap-3 justify-content-end">
                                    <a th:href="@{/admin/utenti}" class="btn btn-outline-secondary px-4">Annulla</a>
                                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow">
                                        Crea Account <i class="bi bi-check-lg ms-2"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
