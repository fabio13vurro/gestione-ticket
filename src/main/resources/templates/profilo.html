<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/fragments :: head('Il Mio Profilo — TicketManager')}"></head>
<body>

<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<main class="main-content">

    <!-- Page header -->
    <div class="mb-4">
        <h1><i class="bi bi-person-circle me-2" style="color:var(--accent-light)"></i>Il Mio Profilo</h1>
        <p class="text-white-50">Gestisci le tue informazioni personali e la foto del profilo.</p>
    </div>

    <div class="row g-4 justify-content-center">

        <!-- ─── LEFT: Avatar + Upload ─────────────────────────────── -->
        <div class="col-lg-4 col-md-5">
            <div class="card p-4 text-center profile-left-card">

                <!-- Avatar grande -->
                <div class="profile-avatar-wrapper mb-3">
                    <div class="profile-avatar-ring">
                        <!-- Se c'è immagine salvata -->
                        <img th:if="${utente.fileData != null}"
                             th:src="'data:image/jpeg;base64,' + ${utente.fileData}"
                             id="avatarImg"
                             class="profile-avatar-img"
                             alt="Foto profilo">
                        <!-- Placeholder iniziali -->
                        <div th:unless="${utente.fileData != null}"
                             class="profile-avatar-placeholder"
                             id="avatarPlaceholder">
                            <span th:text="${#strings.substring(utente.username, 0, 1).toUpperCase()}">U</span>
                        </div>
                    </div>
                    <!-- Bottone camera sovrapposto -->
                    <label for="fileInput" class="profile-camera-btn" title="Cambia foto profilo">
                        <i class="bi bi-camera-fill"></i>
                    </label>
                </div>

                <h2 class="text-dark mb-1 border-0 p-0 fs-4" th:text="${utente.username}">Username</h2>

                <!-- Badge ruolo colorato -->
                <span class="profile-role-badge mb-4 d-inline-block"
                      th:classappend="${utente.ruolo.name() == 'ADMIN'} ? ' role-admin' :
                                     (${utente.ruolo.name() == 'OPERATORE'} ? ' role-operatore' : ' role-cliente')"
                      th:text="${utente.ruolo.name()}">Ruolo</span>

                <!-- Form upload -->
                <form th:action="@{/profilo/aggiorna-immagine}" method="post"
                      enctype="multipart/form-data" id="uploadForm">
                    <input type="file" id="fileInput" name="file"
                           accept="image/*" class="d-none">
                    <div id="uploadPreviewBox" class="d-none mb-3">
                        <p class="text-muted small mb-2" id="fileName">Nessun file selezionato</p>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-cloud-upload-fill me-2"></i>Salva Nuova Foto
                        </button>
                    </div>
                    <p class="text-muted small" id="uploadHint">
                        <i class="bi bi-info-circle me-1"></i>Clicca sull'icona <i class="bi bi-camera"></i> per cambiare foto
                    </p>
                </form>

                <!-- Rimuovi foto (se presente) -->
                <div th:if="${utente.fileData != null}" class="mt-2">
                    <form th:action="@{/profilo/rimuovi-immagine}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-secondary w-100">
                            <i class="bi bi-trash me-1"></i>Rimuovi foto
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ─── RIGHT: Info + Azioni ──────────────────────────────── -->
        <div class="col-lg-7 col-md-7">

            <!-- Info card -->
            <div class="card p-4 mb-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="profile-icon-box me-3">
                        <i class="bi bi-person-lines-fill text-white fs-4"></i>
                    </div>
                    <div>
                        <h2 class="text-dark mb-0 border-0 p-0">Informazioni Personali</h2>
                        <p class="text-muted small mb-0">Dati del tuo account</p>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-sm-6">
                        <div class="profile-info-item">
                            <div class="profile-info-label">
                                <i class="bi bi-person me-2 text-primary"></i>Username
                            </div>
                            <div class="profile-info-value" th:text="${utente.username}">—</div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="profile-info-item">
                            <div class="profile-info-label">
                                <i class="bi bi-envelope me-2 text-primary"></i>Email
                            </div>
                            <div class="profile-info-value" th:text="${utente.email != null ? utente.email : '—'}">—</div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="profile-info-item">
                            <div class="profile-info-label">
                                <i class="bi bi-shield-check me-2 text-primary"></i>Ruolo
                            </div>
                            <div class="profile-info-value" th:text="${utente.ruolo.name()}">—</div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="profile-info-item">
                            <div class="profile-info-label">
                                <i class="bi bi-geo-alt me-2 text-primary"></i>Indirizzo
                            </div>
                            <div class="profile-info-value" th:text="${utente.address != null ? utente.address : '—'}">—</div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="profile-info-item">
                            <div class="profile-info-label">
                                <i class="bi bi-ticket-perforated me-2 text-primary"></i>Ticket Assegnati
                            </div>
                            <div class="profile-info-value">
                                <span class="fw-bold" style="color:var(--accent)"
                                      th:text="${utente.ticketAssegnati}">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="profile-info-item">
                            <div class="profile-info-label">
                                <i class="bi bi-circle-fill me-2"
                                   th:classappend="${utente.deleted} ? 'text-danger' : 'text-success'"></i>Stato Account
                            </div>
                            <div class="profile-info-value"
                                 th:text="${utente.deleted ? 'Disattivato' : 'Attivo'}">Attivo</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const fileInput    = document.getElementById('fileInput');
    const previewBox   = document.getElementById('uploadPreviewBox');
    const fileNameEl   = document.getElementById('fileName');
    const uploadHint   = document.getElementById('uploadHint');

    fileInput.addEventListener('change', function () {
        if (!this.files || !this.files[0]) return;

        const file   = this.files[0];
        const reader = new FileReader();

        reader.onload = function (e) {
            // Aggiorna anteprima avatar
            let img         = document.getElementById('avatarImg');
            let placeholder = document.getElementById('avatarPlaceholder');

            if (!img) {
                img     = document.createElement('img');
                img.id  = 'avatarImg';
                img.className = 'profile-avatar-img';
                img.alt = 'Anteprima';
                document.querySelector('.profile-avatar-ring').appendChild(img);
            }
            img.src          = e.target.result;
            img.style.display = 'block';
            if (placeholder) placeholder.style.display = 'none';

            // Mostra box salvataggio
            fileNameEl.textContent = '📎 ' + file.name;
            previewBox.classList.remove('d-none');
            uploadHint.classList.add('d-none');
        };

        reader.readAsDataURL(file);
    });
</script>
</body>
</html>
