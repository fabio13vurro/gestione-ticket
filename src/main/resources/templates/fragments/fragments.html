<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Gestione Ticket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar">
    <div class="navbar-container px-4 d-flex justify-content-between align-items-center w-100">
        <div class="d-flex align-items-center gap-4">
            <a th:href="@{/home}" class="navbar-brand">
                <i class="bi bi-ticket-perforated-fill"></i>
                <span>TicketManager</span>
            </a>
            
            <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/home}" class="nav-link">
                        <i class="bi bi-house-door"></i> Home
                    </a>
            </div>
        </div>

        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
            <div class="user-profile">
                <div class="user-info">
                    <span class="user-name" sec:authentication="name">Username</span>
                    <span class="user-role" sec:authorize="hasRole('ADMIN')">Admin</span>
                    <span class="user-role" sec:authorize="hasRole('OPERATORE')">Operatore</span>
                    <span class="user-role" sec:authorize="hasRole('CLIENTE')">Cliente</span>
                </div>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm ms-3 shadow-none border-0" title="Logout">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="mt-5 pb-4 text-center">
    <hr class="opacity-25">
    <p class="text-white-50 small mb-0">© 2026 TicketManager — Progettato per l'eccellenza.</p>
</footer>

</body>
</html>
