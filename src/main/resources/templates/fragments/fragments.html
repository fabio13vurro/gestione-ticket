<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Gestione Ticket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar">
    <div class="navbar-container px-4 d-flex justify-content-between align-items-center w-100">
        <div class="d-flex align-items-center gap-4">
            <a th:href="@{/home}" class="navbar-brand">
                <i class="bi bi-ticket-perforated-fill"></i>
                <span>TicketManager</span>
            </a>

            <div sec:authorize="isAuthenticated()">
                <span th:if="${currentPage == 'home'}"
                      class="nav-link disabled text-white-50"
                      style="cursor: default;">
                    <i class="bi bi-house-door-fill"></i> Home
                </span>
                <a th:unless="${currentPage == 'home'}"
                   th:href="@{/home}" class="nav-link">
                    <i class="bi bi-house-door"></i> Home
                </a>
            </div>
        </div>

        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
            <a th:href="@{/profilo}" class="user-profile text-decoration-none" title="Il mio profilo">
                <!-- Avatar: immagine reale se presente, altrimenti iniziale -->
                <div class="navbar-avatar">
                    <img th:if="${currentUtente != null and currentUtente.fileData != null}"
                         th:src="'data:image/jpeg;base64,' + ${currentUtente.fileData}"
                         class="navbar-avatar-img" alt="Avatar">
                    <span th:unless="${currentUtente != null and currentUtente.fileData != null}"
                          class="navbar-avatar-initials"
                          sec:authentication="name"
                          th:text="${currentUtente != null ? #strings.substring(currentUtente.username,0,1).toUpperCase() : '?'}">U</span>
                </div>
                <div class="user-info">
                    <span class="user-name" sec:authentication="name">Username</span>
                    <span class="user-role" sec:authorize="hasRole('ADMIN')">Admin</span>
                    <span class="user-role" sec:authorize="hasRole('OPERATORE')">Operatore</span>
                    <span class="user-role" sec:authorize="hasRole('CLIENTE')">Cliente</span>
                </div>
            </a>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm shadow-none border-0" title="Logout">
                <i class="bi bi-box-arrow-right fs-5"></i>
            </a>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="mt-5 pb-4 text-center">
    <hr class="opacity-25">
    <p class="text-white-50 small mb-0">© 2026 TicketManager — Progettato per l'eccellenza.</p>
</footer>

</body>
</html>
